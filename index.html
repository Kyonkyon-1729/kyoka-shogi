<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>強化将棋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: one narrow column (max 520px) — header, room/score strip, board between the two hands, action area below */
:root{
  --bg:#e8eaf0; --surface:#f7f8fb; --ink:#1b1f2c; --muted:#5b6176; --line:#cdd2de;
  --ai:#2c3f7a; --on-ai:#ffffff; --ai-soft:#dfe4f4;
  --shu:#c23b26; --shu-soft:#f6dcd6; --kin:#a87b10; --kin-soft:#f3e6c4;
  --wood:#e2b670; --wood-line:#6e4a1f; --koma:#f5dfb0; --koma-edge:#bf955a; --koma-ink:#1a1408; --koma-red:#b3261a;
  --hint:rgba(44,63,122,.30); --last:rgba(194,59,38,.16);
  --violet:#7a3fc4; --ice:#bfe0ff; --ice-ink:#2c7fc9;
  --f-disp:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-ui:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11131b; --surface:#1a1d29; --ink:#ebe8e1; --muted:#9aa0b4; --line:#2e3346;
  --ai:#9db0f0; --on-ai:#11131b; --ai-soft:#243058;
  --shu:#ff7461; --shu-soft:#4a2019; --kin:#e6bb4e; --kin-soft:#3d3115;
  --wood:#c4944f; --wood-line:#3a2409; --koma:#efd6a2; --koma-edge:#a77f42;
  --hint:rgba(20,30,70,.45); --last:rgba(255,116,97,.22); --violet:#9466ec; --ice:#bfe0ff; --ice-ink:#3d95e0; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#11131b; --surface:#1a1d29; --ink:#ebe8e1; --muted:#9aa0b4; --line:#2e3346;
  --ai:#9db0f0; --on-ai:#11131b; --ai-soft:#243058;
  --shu:#ff7461; --shu-soft:#4a2019; --kin:#e6bb4e; --kin-soft:#3d3115;
  --wood:#c4944f; --wood-line:#3a2409; --koma:#efd6a2; --koma-edge:#a77f42;
  --hint:rgba(20,30,70,.45); --last:rgba(255,116,97,.22); --violet:#9466ec; --ice:#bfe0ff; --ice-ink:#3d95e0; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6}
.wrap{max-width:520px;margin:0 auto;padding:16px;padding-block:14px 40px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.top h1{font-family:var(--f-disp);font-weight:800;font-size:26px;letter-spacing:.06em;margin:0;text-wrap:balance}
.top h1 small{font-family:var(--f-ui);font-weight:400;font-size:12px;letter-spacing:.08em;color:var(--muted);margin-left:8px}
.chip{font-size:12px;letter-spacing:.06em;padding:3px 10px;border-radius:999px;background:var(--ai-soft);color:var(--ink);white-space:nowrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h2{margin:0;font-size:16px}
.label{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{padding:6px 14px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--bg)}
.seg input:checked+label{background:var(--ai);color:var(--on-ai);border-color:var(--ai)}
.seg input:focus-visible+label{outline:2px solid var(--shu);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px}
button.primary{background:var(--ai);color:var(--on-ai);border-color:var(--ai);font-weight:700}
button.danger{color:var(--shu);border-color:var(--shu)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,[data-act]:focus-visible{outline:2px solid var(--shu);outline-offset:2px}
input[type=text]{font:inherit;font-size:20px;letter-spacing:.3em;text-transform:uppercase;width:9ch;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.note{font-size:13px;color:var(--muted);margin:0}
.err{font-size:13px;color:var(--shu);background:var(--shu-soft);padding:8px 12px;border-radius:8px;margin:0}
.code{font-family:var(--f-disp);font-size:44px;letter-spacing:.25em;font-weight:800;text-align:center}
details summary{cursor:pointer;font-weight:700}
details ul{margin:8px 0 0;padding-left:20px;font-size:14px}

/* score strip */
.strip{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.player{display:flex;flex-direction:column;gap:2px;min-width:0}
.player.r{text-align:right;align-items:flex-end}
.player b{font-size:14px}
.player span{font-size:12px;color:var(--muted)}
.player.turn b{color:var(--shu)}
.score{font-family:var(--f-disp);font-weight:800;font-size:24px;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1}
.score small{display:block;font-family:var(--f-ui);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.06em}
.timer{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;background:var(--ai);width:100%;transition:width .25s linear}
.timer.low i{background:var(--shu)}
.tline{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* board */
.hand{display:flex;gap:6px;flex-wrap:wrap;min-height:44px;align-items:center;padding:6px 8px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.hand .who{font-size:11px;color:var(--muted);letter-spacing:.06em;margin-right:4px}
.hand .none{font-size:12px;color:var(--muted)}
.hp{position:relative;width:34px;cursor:default}
.hp.can{cursor:pointer}
.hp.on .koma{box-shadow:0 0 0 2px var(--shu)}
.hp em{position:absolute;right:-4px;bottom:-4px;font-style:normal;font-size:11px;background:var(--ink);color:var(--surface);border-radius:999px;padding:0 5px;font-variant-numeric:tabular-nums}
.bwrap{display:grid;grid-template-columns:1fr 16px;grid-template-rows:16px auto;gap:2px}
.files{display:grid;grid-template-columns:repeat(9,1fr);font-size:11px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.ranks{display:grid;grid-template-rows:repeat(9,1fr);font-size:11px;color:var(--muted);align-items:center;text-align:center;font-family:var(--f-disp)}
.board{position:relative;display:grid;grid-template-columns:repeat(9,1fr);gap:1px;background:var(--wood-line);border:2px solid var(--wood-line);border-radius:3px}
.board .hoshi{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--wood-line);transform:translate(-50%,-50%);z-index:2;pointer-events:none}
.cell{position:relative;aspect-ratio:1/1.09;background:var(--wood);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:2px;min-width:0}
.cell.last{background:linear-gradient(var(--last),var(--last)),var(--wood)}
.cell.sel{background:linear-gradient(var(--hint),var(--hint)),var(--wood)}
.cell .dot{width:28%;height:26%;border-radius:50%;background:var(--ai);opacity:.75}
.cell.cap::after{content:"";position:absolute;inset:2px;border:3px solid var(--ai);border-radius:4px;opacity:.85;pointer-events:none}
.cell.check .koma{box-shadow:0 0 0 3px var(--shu)}
.koma{position:relative;width:88%;aspect-ratio:1/1.12;background:var(--koma);clip-path:polygon(50% 0,86% 16%,100% 100%,0 100%,14% 16%);display:flex;align-items:center;justify-content:center;font-family:var(--f-disp);font-weight:800;color:var(--koma-ink);font-size:clamp(14px,4.6vw,22px);line-height:1;padding-top:12%}
.koma.down{transform:rotate(180deg)}
.koma.pr{color:var(--koma-red)}
.hp .koma{width:100%;font-size:18px}
.mark{position:absolute;top:1px;right:1px;z-index:3;min-width:13px;height:13px;border-radius:7px;font-size:9px;line-height:13px;text-align:center;font-weight:700;background:var(--ai);color:var(--on-ai);padding:0 3px;pointer-events:none}
.mark.f{background:var(--kin);color:#1a1408}
.status{font-size:14px;min-height:22px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--shu-soft);color:var(--shu)}
.info{font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:0}
.promo{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px;border-radius:10px;background:var(--kin-soft)}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.card{text-align:left;display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);min-width:0}
.card:hover{border-color:var(--ai)}
.card .no{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;align-items:center}
.card .nm{font-family:var(--f-disp);font-weight:800;font-size:18px;line-height:1.3}
.card .ds{font-size:13px}
.card .fc{font-size:12px;color:var(--kin);border-top:1px dashed var(--line);padding-top:6px}
.card .cp{font-size:11px;color:var(--muted)}
.tier{font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px}
.tier.t0{background:var(--line);color:var(--ink)}
.tier.t1{background:var(--ai-soft);color:var(--ai)}
.tier.t2{background:var(--shu-soft);color:var(--shu)}
.camp{display:grid;grid-template-columns:repeat(9,1fr);gap:1px;background:var(--wood-line);border:2px solid var(--wood-line);border-radius:3px}
.camp .cell{cursor:default}
.camp .cell.el{cursor:pointer}
.camp .cell.el .koma{box-shadow:0 0 0 2px var(--ai)}
.camp .cell.dim .koma{opacity:.35}
.camp .cell.pk{background:linear-gradient(var(--hint),var(--hint)),var(--wood)}
.camp .cell.pk .koma{box-shadow:0 0 0 3px var(--kin)}
.enhlist{margin:0;padding-left:18px;font-size:13px}
.big{font-family:var(--f-disp);font-weight:800;font-size:28px;text-align:center;margin:0}
.dice{font-family:var(--f-disp);font-size:40px;font-weight:800;text-align:center;min-width:56px}
@media (prefers-reduced-motion:reduce){.timer i{transition:none}}
.twocol{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:10px}
.twocol h3{margin:0 0 4px;font-size:14px}
.enhboth summary{font-weight:700;cursor:pointer}
.skillbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px;border-radius:10px;background:var(--ai-soft)}
button.skill{border-color:var(--violet);color:var(--violet);font-weight:700}
.cell.skt::after{content:"";position:absolute;inset:2px;border:3px solid var(--violet);border-radius:4px;pointer-events:none}
.skm{position:absolute;left:1px;bottom:1px;z-index:3;font-size:9px;line-height:13px;padding:0 3px;border-radius:4px;background:var(--violet);color:#fff;font-weight:700;pointer-events:none}
.skm.ice{background:var(--ice-ink)}
.shm{position:absolute;left:1px;top:1px;z-index:3;font-size:9px;line-height:13px;padding:0 3px;border-radius:4px;background:var(--kin);color:#1a1408;font-weight:700;pointer-events:none}
.koma.ice{background:linear-gradient(160deg,var(--ice),var(--koma));}
.board{overflow:visible}
.banner{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);z-index:6;pointer-events:none;font-family:var(--f-disp);font-weight:800;font-size:clamp(34px,11vw,56px);letter-spacing:.08em;white-space:nowrap;color:#fff;padding:4px 18px;border-radius:10px;background:var(--shu);box-shadow:0 6px 24px rgba(0,0,0,.35);animation:bannerpop 2.4s ease-out forwards}
.banner.fx-freeze{background:var(--ice-ink)}.banner.fx-warp,.banner.fx-swap,.banner.fx-summon{background:var(--violet)}.banner.fx-thunder{background:var(--kin);color:#1a1408}
@keyframes bannerpop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}30%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%) scale(1)}}
.cell.fx::before{content:"";position:absolute;inset:-4px;z-index:4;border-radius:50%;pointer-events:none;animation:burst .9s ease-out forwards;background:radial-gradient(circle,rgba(255,220,90,.95),rgba(255,120,40,.6) 45%,transparent 70%)}
.cell.fx-freeze::before{background:radial-gradient(circle,rgba(220,245,255,.95),rgba(110,180,255,.6) 45%,transparent 70%)}
.cell.fx-warp::before,.cell.fx-swap::before,.cell.fx-summon::before{background:radial-gradient(circle,rgba(240,210,255,.95),rgba(140,80,230,.6) 45%,transparent 70%)}
.cell.fx-thunder::before{background:radial-gradient(circle,#fff,rgba(255,230,80,.85) 35%,transparent 70%)}
@keyframes burst{0%{opacity:1;transform:scale(.2)}60%{opacity:.9}100%{opacity:0;transform:scale(1.8)}}

.evbox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.evbox .evname{font-family:var(--f-disp);font-weight:800;font-size:18px;padding:2px 10px;border-radius:8px;background:var(--shu);color:#fff;white-space:nowrap}
.evbox.big{border-width:2px;border-color:var(--shu)}
.evbox.fx-freeze .evname{background:var(--ice-ink)}.evbox.fx-freeze{border-color:var(--ice-ink)}
.evbox.fx-warp .evname,.evbox.fx-swap .evname,.evbox.fx-summon .evname{background:var(--violet)}.evbox.fx-warp,.evbox.fx-swap,.evbox.fx-summon{border-color:var(--violet)}
.evbox.fx-thunder .evname,.evbox.fx-shield .evname{background:var(--kin);color:#1a1408}.evbox.fx-thunder,.evbox.fx-shield{border-color:var(--kin)}
.cell.fxmark::after{content:"";position:absolute;inset:1px;border:3px dashed var(--shu);border-radius:4px;pointer-events:none;z-index:2}
.cell.fxmark.fx-freeze::after{border-color:var(--ice-ink)}
.cell.fxmark.fx-warp::after,.cell.fxmark.fx-swap::after,.cell.fxmark.fx-summon::after{border-color:var(--violet)}
.cell.fxmark.fx-thunder::after{border-color:var(--kin)}
.cell .peek{width:30%;height:28%;border-radius:50%;border:2px dashed var(--ink);opacity:.55}
.cell .peekc{position:absolute;inset:3px;border:2px dashed var(--ink);border-radius:50%;opacity:.5;pointer-events:none;z-index:2}
.info{display:flex;flex-direction:column;gap:6px}
.infohead{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.effects{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.effects li span:last-child{color:var(--muted)}
.fv{font-size:11px;font-weight:700;margin-left:6px;padding:0 6px;border-radius:5px;background:var(--kin-soft);color:var(--kin)}
.st{font-size:11px;font-weight:700;margin-left:6px;padding:0 6px;border-radius:5px;background:var(--line);color:var(--ink)}
.st.ok{background:var(--violet);color:#fff}
.ed{margin:2px 0 6px}.ed span{color:var(--muted);font-size:12px}
.promopop{position:absolute;z-index:8;display:flex;gap:4px;padding:5px;border-radius:10px;background:var(--surface);border:2px solid var(--kin);box-shadow:0 6px 20px rgba(0,0,0,.35);width:max-content;max-width:100%}
.promopop button{flex:0 0 auto;min-width:58px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;font-size:11px;border-radius:8px;min-width:0}
.promopop button .koma{width:30px;font-size:17px}
.promopop button.x{flex:0 0 26px;justify-content:center;font-size:16px;padding:0}
.board.shake{animation:shake .5s ease-in-out}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(3px,0)}}
.cell.fx::before{inset:-14px;animation-duration:1.3s}
@media (prefers-reduced-motion:reduce){.board.shake{animation:none}}

.cell.bad::after{content:"×";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:var(--shu);border:3px solid var(--shu);border-radius:4px;pointer-events:none;z-index:2}
.cell.bad .dot{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.midpanel{border:2px solid var(--kin)}
.cell.midel{cursor:pointer}.cell.midel .koma{box-shadow:0 0 0 3px var(--kin)}
.chipbtn{padding:5px 10px;font-size:13px;border-radius:999px}
.chipbtn.on{background:var(--ai);color:var(--on-ai);border-color:var(--ai)}
.hpbtn{padding:4px 6px}
.practice details summary{font-weight:700;font-size:14px}
@media (prefers-reduced-motion:reduce){.banner{animation:none;opacity:0}.cell.fx::before{animation:none;opacity:0}}

</style>

</head>
<body>
<div class="wrap">
  <header class="top"><h1>強化将棋<small>試作版</small></h1><span class="chip" id="mode">準備中</span></header>
  <main id="view" style="display:flex;flex-direction:column;gap:14px"></main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* =====================================================================
   Firebase の設定（ここだけ書き換える）
   Firebase コンソール → プロジェクトの設定 → マイアプリ（ウェブ）に出てくる
   firebaseConfig の中身を、下の { } の中にそのまま貼り付けてください。
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "ここに貼る",
  authDomain: "",
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: ""
};
</script>
<script>
/* ================= ルールデータ ================= */
const KANJI={P:'歩',L:'香',N:'桂',S:'銀',G:'金',B:'角',R:'飛',K:'玉'};
const PROM={P:'と',L:'杏',N:'圭',S:'全',B:'馬',R:'龍'};
const VAL={P:1,L:3,N:4,S:5,G:6,B:8,R:10,K:100};
const CANP=new Set(['P','L','N','S','B','R']);
const TIER_CAP={'弱':5,'中':3,'強':1};
const TIER_W={'弱':4,'中':3,'強':2};
const TIER_CLS={'弱':'t0','中':'t1','強':'t2'};
const NOT_K=['P','L','N','S','G','B','R'];
const CARDS={
  c1:{no:1,name:'歩の横歩き',tier:'中',types:['P'],desc:'歩が横1マスにも動ける',fdesc:'横に2マスまで動ける'},
  c2:{no:2,name:'歩の後退',tier:'弱',types:['P'],desc:'歩が後ろ1マスにも動ける',fdesc:'斜め後ろにも動ける'},
  c3:{no:3,name:'香車の後退',tier:'弱',types:['L'],desc:'香車が後ろ1マスにも動ける',fdesc:'後ろにもまっすぐ何マスでも'},
  c4:{no:4,name:'桂馬の横跳び',tier:'中',types:['N'],desc:'「横2・前1」にも跳べる',fdesc:'8方向すべてに跳べる'},
  c5:{no:5,name:'桂馬の後ろ跳び',tier:'中',types:['N'],desc:'後ろ向きにも跳べる',fdesc:'さらに横1マスにも動ける'},
  c6:{no:6,name:'銀の横移動',tier:'中',types:['S'],desc:'銀が横1マスにも動ける',fdesc:'横に2マスまで動ける'},
  c7:{no:7,name:'金の斜め後退',tier:'中',types:['G'],desc:'金が斜め後ろにも動ける',fdesc:'さらに前に2マスまで動ける'},
  c10:{no:10,name:'玉の大股',tier:'中',types:['K'],desc:'玉が縦横に2マスまで動ける',fdesc:'斜めにも2マスまで動ける'},
  c11:{no:11,name:'早成り',tier:'中',types:['P','L','N','S','B','R'],desc:'敵陣の1段手前から成れる',fdesc:'2段手前から成れる'},

const other=s=>s==='a'?'b':'a';

const ST=(dx,dy)=>({k:'s',dx,dy});
const RY=(dx,dy,max=9,over=0)=>({k:'r',dx,dy,max,over});
const GOLD=[ST(-1,-1),ST(0,-1),ST(1,-1),ST(-1,0),ST(1,0),ST(0,1)];

function hasCard(p,c){return (p.e||[]).find(e=>e.c===c)||null;}
function patterns(p){
  const o=[];
  switch(p.t){
    case 'P': p.pr?o.push(...GOLD):o.push(ST(0,-1));break;
    case 'L': if(p.pr)o.push(...GOLD);else{const j=hasCard(p,'c12');o.push(RY(0,-1,9,j?(j.f?2:1):0));}break;
    case 'N': p.pr?o.push(...GOLD):o.push(ST(-1,-2),ST(1,-2));break;
    case 'S': p.pr?o.push(...GOLD):o.push(ST(-1,-1),ST(0,-1),ST(1,-1),ST(-1,1),ST(1,1));break;
    case 'G': o.push(...GOLD);break;
    case 'K': ORTH.concat(DIAG).forEach(([a,b])=>o.push(ST(a,b)));break;
    case 'B':{const j=hasCard(p,'c36'),ov=j?(j.f?2:1):0;DIAG.forEach(([a,b])=>o.push(RY(a,b,9,ov)));if(p.pr)ORTH.forEach(([a,b])=>o.push(ST(a,b)));break;}
    case 'R':{const j=hasCard(p,'c37'),ov=j?(j.f?2:1):0;ORTH.forEach(([a,b])=>o.push(RY(a,b,9,ov)));if(p.pr)DIAG.forEach(([a,b])=>o.push(ST(a,b)));break;}
  }
  for(const e of (p.e||[])){const f=e.f;switch(e.c){
    case 'c1': case 'c6': f?o.push(RY(-1,0,2),RY(1,0,2)):o.push(ST(-1,0),ST(1,0));break;
    case 'c2': o.push(ST(0,1));if(f)o.push(ST(-1,1),ST(1,1));break;
    case 'c3': f?o.push(RY(0,1)):o.push(ST(0,1));break;
    case 'c4': if(f){for(const[a,b]of[[1,2],[2,1]])for(const sa of[1,-1])for(const sb of[1,-1])o.push(ST(a*sa,b*sb));}else o.push(ST(-2,-1),ST(2,-1));break;
    case 'c5': o.push(ST(-1,2),ST(1,2));if(f)o.push(ST(-1,0),ST(1,0));break;
    case 'c7': o.push(ST(-1,1),ST(1,1));if(f)o.push(RY(0,-1,2));break;
    case 'c10': (f?ORTH.concat(DIAG):ORTH).forEach(([a,b])=>o.push(RY(a,b,2)));break;
    case 'c8': if(!p.pr)ORTH.forEach(([a,b])=>o.push(ST(a,b)));else if(f)ORTH.forEach(([a,b])=>o.push(RY(a,b,2)));break;
    case 'c9': if(!p.pr)DIAG.forEach(([a,b])=>o.push(ST(a,b)));else if(f)DIAG.forEach(([a,b])=>o.push(RY(a,b,2)));break;
    case 'c31': o.push(RY(0,-1,f?3:2));break;
    case 'c32': o.push(RY(0,-1,2));if(f)o.push(RY(-1,-1,2),RY(1,-1,2));break;
    case 'c34': if(f){for(const[a,b]of[[1,2],[2,1]])for(const sa of[1,-1])for(const sb of[1,-1])o.push(ST(a*sa,b*sb));}else o.push(ST(-1,-2),ST(1,-2));break;

}
/* 技のクールダウン（自分のターン数）[通常, 集中] */

function targets(G,i,incOwn){

  const s=p.o===G.s?1:-1,x0=i%9,y0=(i/9)|0,res=new Set();

    else{let ov=pt.over;for(let k=1;k<=pt.max;k++){const x=x0+dx*k,y=y0+dy*k;if(x<0||x>8||y<0||y>8)break;const j=y*9+x,q=G.b[j];
      if(!q){res.add(j);continue;} if(q.o!==p.o||incOwn)res.add(j); if(ov>0){ov--;continue;} break;}}

const rel=(G,o,y)=>o===G.s?y:8-y;
function zoneDepth(p){const c=hasCard(p,'c11');return 3+(c?(c.f?2:1):0);}
function pseudoMoves(G,c){
  const ms=[];
  for(let i=0;i<81;i++){const p=G.b[i];if(!p||p.o!==c)continue;
    const d=zoneDepth(p),fr=rel(G,c,(i/9)|0);
    for(const t of targets(G,i)){const tr=rel(G,c,(t/9)|0);
      const canP=!p.pr&&CANP.has(p.t)&&(fr<d||tr<d);
      const must=!p.pr&&(((p.t==='P'||p.t==='L')&&tr===0)||(p.t==='N'&&tr<=1));
      if(canP)ms.push({f:i,t,pr:1}); if(!must||!canP)ms.push({f:i,t,pr:0});}
    if(!frozen(G,p))skillMoves(G,c,i,p,ms);}
  const h=G.h[c],pl=G.pl||{},nifuOK=((pl[c]||{}).c16||0)>=1,aw=((pl[other(c)]||{}).c30||0);
  const ek=aw?G.b.findIndex(p=>p&&p.o!==c&&p.t==='K'):-1;
  for(const t in h){if(!h[t])continue;
    for(let i=0;i<81;i++){if(G.b[i])continue;const r=rel(G,c,(i/9)|0);
      if((t==='P'||t==='L')&&r===0)continue; if(t==='N'&&r<=1)continue;
      if(ek>=0&&Math.max(Math.abs(i%9-ek%9),Math.abs(((i/9)|0)-((ek/9)|0)))<=aw)continue;
      if(t==='P'&&!nifuOK){const x=i%9;let dup=false;for(let y=0;y<9;y++){const q=G.b[y*9+x];if(q&&q.o===c&&q.t==='P'&&!q.pr){dup=true;break;}}if(dup)continue;}

function deadRank(G,o,t,i){const r=rel(G,o,(i/9)|0);return ((t==='P'||t==='L')&&r===0)||(t==='N'&&r<=1);}
function skillMoves(G,c,i,p,ms){
  for(const e of (p.e||[])){
    if(!CD[e.c]||cdLeft(G,p,e.c)>0)continue;const f=e.f,S=e.c;
    switch(S){
      case 'c40': case 'c42':
        for(let j=0;j<81;j++){const q=G.b[j];if(q&&q.o!==c&&q.t!=='K'&&cheb(i,j)<=2&&!(S==='c42'&&frozen(G,q)))ms.push({k:'sk',s:S,f:i,t:j});}break;
      case 'c41':{const r=f?4:3;for(let j=0;j<81;j++)if(!G.b[j]&&cheb(i,j)<=r&&!(!p.pr&&deadRank(G,c,p.t,j)))ms.push({k:'sk',s:S,f:i,t:j});break;}
      case 'c43':{let any=false;for(let j=0;j<81;j++){const q=G.b[j];if(q&&q.o!==c&&q.t!=='K'&&cheb(i,j)===1){any=true;break;}}if(any)ms.push({k:'sk',s:S,f:i,t:i});break;}
      case 'c46':{const tt=f?'G':'P',nifuOK=(((G.pl||{})[c]||{}).c16||0)>=1;
        for(let j=0;j<81;j++){if(G.b[j]||cheb(i,j)!==1)continue;if(deadRank(G,c,tt,j))continue;
          if(tt==='P'&&!nifuOK){let dup=false;for(let y=0;y<9;y++){const q=G.b[y*9+j%9];if(q&&q.o===c&&q.t==='P'&&!q.pr){dup=true;break;}}if(dup)continue;}
          ms.push({k:'sk',s:S,f:i,t:j});}break;}
      case 'c47': for(let j=0;j<81;j++){const q=G.b[j];if(j!==i&&q&&q.o===c)ms.push({k:'sk',s:S,f:i,t:j});}break;

}
function inCheck(G,c){
  const k=G.b.findIndex(p=>p&&p.o===c&&p.t==='K');if(k<0)return true;
  for(let i=0;i<81;i++){const p=G.b[i];if(p&&p.o!==c&&targets(G,i).includes(k))return true;}
  return false;
}
function homeIdx(G,p){const z=ALLSET.find(q=>q.id===p.id);if(!z)return null;const sn=p.o===G.s;return (sn?z.y:8-z.y)*9+(sn?z.x:8-z.x);}
function nearestCamp(G,b,o,home){let best=null,bd=99;for(let i=0;i<81;i++){if(b[i])continue;if(rel(G,o,(i/9)|0)<6)continue;
  const d=home==null?0:Math.abs(i%9-home%9)+Math.abs(((i/9)|0)-((home/9)|0));if(d<bd){bd=d;best=i;}}return best;}
function plain(o,t){return{o,t,pr:false,id:null,e:[],sh:0,rv:0,cv:0};}
function shieldHit(G,q){const r={...q,sh:q.sh-1};const g=hasCard(q,'c45');if(g&&r.sh===0)r.rg=(G.t||0)+2*(g.f?3:4);return r;}
function destroy(G,b,i){const q=b[i];b[i]=null;
  if(q&&q.rv>0){const rev={...q,rv:q.rv-1,pr:false,fz:0},home=homeIdx(G,rev),sp=(home!=null&&!b[home])?home:nearestCamp(G,b,rev.o,home);if(sp!=null)b[sp]=rev;}}
function applyMove(G,m,c){
  const T=G.t||0,t1=T+1;
  const b=G.b.slice(),h={a:{...G.h.a},b:{...G.h.b}},mk=()=>({b,h,s:G.s,pl:G.pl,t:t1});let ev='move',fx=[];
  for(let i=0;i<81;i++){const p=b[i];if(p&&p.rg&&!p.sh&&t1>=p.rg)b[i]={...p,sh:1,rg:0};}
  if(m.d){b[m.t]=plain(c,m.d);h[c][m.d]--;return{G:mk(),ev:'drop',fx};}
  if(m.k==='sk'){
    const p=b[m.f],e=hasCard(p,m.s),n=CD[m.s][e&&e.f?1:0];
    b[m.f]={...p,cd:{...(p.cd||{}),[m.s]:T+2*n}};

function legalMoves(G,c,noUchi){

const hasKing=(G,c)=>G.b.some(p=>p&&p.o===c&&p.t==='K');
/* ---- CPU：駒の価値＋玉の守り＋取られる危険で手を評価する ---- */
function pieceVal(p){return p.t==='K'?0:VAL[p.t]+(p.pr?(p.t==='B'||p.t==='R'?2:Math.max(0,6-VAL[p.t])*.8):0)+(p.e||[]).length*.6+(p.sh||0)*1.5+(p.rv||0)*1.5;}
function evalFor(G,c){
  const e=other(c);let s=0;
  const kc=G.b.findIndex(p=>p&&p.o===c&&p.t==='K'),ke=G.b.findIndex(p=>p&&p.o===e&&p.t==='K');
  for(let i=0;i<81;i++){const p=G.b[i];if(!p)continue;const v=pieceVal(p);s+=p.o===c?v:-v;
    if(p.t!=='K'){const near=(k)=>k>=0&&Math.max(Math.abs(i%9-k%9),Math.abs(((i/9)|0)-((k/9)|0)))<=2;
      if(p.o===c&&near(kc))s+=.25; if(p.o===e&&near(ke))s-=.25; if(p.o===c&&near(ke))s+=.35; if(p.o===e&&near(kc))s-=.35;}}
  for(const t in G.h[c])s+=VAL[t]*G.h[c][t]*1.05;
  for(const t in G.h[e])s-=VAL[t]*G.h[e][t]*1.05;
  return s;
}
function attackMap(G,owner,incOwn){const m=new Map();
  for(let i=0;i<81;i++){const p=G.b[i];if(!p||p.o!==owner)continue;for(const t of targets(G,i,incOwn)){let l=m.get(t);if(!l)m.set(t,l=[]);l.push(p);}}return m;}
function threatOn(G,c){
  // c の駒が次に取られるときの、いちばん大きい損
  const E=attackMap(G,other(c),false),D=attackMap(G,c,true);let worst=0;
  for(let i=0;i<81;i++){const v=G.b[i];if(!v||v.o!==c||v.t==='K'||v.sh>0)continue;
    const att=E.get(i);if(!att)continue;
    const cheap=Math.min(...att.map(a=>a.t==='K'?50:pieceVal(a))),def=!!D.get(i);
    const loss=v.rv>0?1:pieceVal(v)-(def?Math.min(cheap,pieceVal(v)):0);
    if(loss>worst)worst=loss;}
  return worst;
}
function score1(G,m,c){const r=applyMove(G,m,c);return{r,s:evalFor(r.G,c)-threatOn(r.G,c)*.9+(m.d?-.15:0)};}
function cpuMove(G,c,lv){
  const kc=pseudoMoves(G,c).find(m=>!m.k&&!m.d&&G.b[m.t]&&G.b[m.t].t==='K');if(kc)return kc;
  const ms=legalMoves(G,c);if(!ms.length)return null;
  if(lv>=2)for(const m of ms){const r=applyMove(G,m,c);if(inCheck(r.G,other(c))&&legalMoves(r.G,other(c)).length===0)return m;}
  if(lv===1&&Math.random()<.2)return ms[Math.floor(Math.random()*ms.length)];
  const noise=lv===1?3:lv===2?.4:.15;
  const scored=ms.map(m=>{const x=score1(G,m,c);return{m,r:x.r,s:x.s+Math.random()*noise};}).sort((a,b)=>b.s-a.s);
  if(lv<3)return scored[0].m;
  const e=other(c);let best=scored[0].m,bs=-1e9;
  for(const cand of scored.slice(0,7)){
    const replies=legalMoves(cand.r.G,e);let opp=-1e9;
    for(const rm of replies){const r2=applyMove(cand.r.G,rm,e);
      let v=evalFor(r2.G,e);
      if(inCheck(r2.G,c)&&legalMoves(r2.G,c).length===0)v=1000;
      if(v>opp)opp=v;if(opp>=1000)break;}
    const sc=-opp+cand.s*.3+Math.random()*noise;
    if(sc>bs){bs=sc;best=cand.m;}
  }
  return best;
}
function autoMove(G,c){return cpuMove(G,c,2);}
function cpuPick(s){
  const sd=SEATS[s];if(!sd||!sd.pick||!sd.pick.offer||!sd.pick.offer.length)return;
  const w={'強':3,'中':2,'弱':1};
  const cid=sd.pick.offer.map(id=>({id,v:w[CARDS[id].tier]+Math.random()*1.5})).sort((a,b)=>b.v-a.v)[0].id;
  const c=CARDS[cid];if(c.player)return takePlayerCard(s,cid);
  const el=eligible(sd,cid).map(z=>({z,v:VAL[z.t]+Math.random()*3})).sort((a,b)=>b.v-a.v);
  const max=Math.min(TIER_CAP[c.tier],el.length);
  const n=max>1&&Math.random()<.5?max:1;
  takePieceCard(s,cid,el.slice(0,n).map(x=>x.z.id));
}
function posKey(G,turn){let s=turn;for(const p of G.b)s+=p?(p.o+p.t+(p.pr?'+':'')):'.';s+=JSON.stringify(G.h);
  let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return(h>>>0).toString(36);}
function buildBoard(sente,seats){
  const b=Array(81).fill(null);
  for(const o of['a','b']){const sd=seats[o]||{},sn=o===sente;
    for(const z of setupFor(sd)){const x=sn?z.x:8-z.x,y=sn?z.y:8-z.y,e=((sd.enh||{})[z.id])||[];
      const rv=e.find(q=>q.c==='c13'),sh=e.find(q=>q.c==='c14'),cv=e.find(q=>q.c==='c21'),ps=e.find(q=>q.c==='c33');
      b[y*9+x]={o,t:z.t,pr:!!ps,id:z.id,e:e.map(q=>({c:q.c,f:!!q.f})),sh:(sh?(sh.f?2:1):0)+(ps&&ps.f?1:0)+(e.some(q=>q.c==='c45')?1:0),cd:{},fz:0,rg:0,rv:rv?(rv.f?2:1):0,cv:cv?(cv.f?2:1):0};}}
  return b;
}
function startHand(sd){const h=emptyHand(),l=((sd||{}).pl||{}).c25||0;if(l>=2)h.L=1;else if(l===1)h.P=1;return h;}
function startPl(seats){const o={};for(const s of['a','b'])o[s]={...((seats[s]||{}).pl||{})};return o;}

function startMatch(R,senteOverride){
  const n=clone(R),s=senteOverride||n.sente||'a';
  n.sente=s;n.match=(n.match||0)+1;n.G={b:buildBoard(s,SEATS),h:{a:startHand(SEATS.a),b:startHand(SEATS.b)},s,pl:startPl(SEATS),t:0};
  n.turn=s;n.ply=0;n.to={a:0,b:0};n.hist=[{k:posKey(n.G,s),by:'',chk:false}];n.last=null;n.phase='playing';
  n.ends=Date.now()+moveMs(n,s);return n;
}
function doMove(m,auto){
  const R=ROOM;if(!R||R.phase!=='playing'||R.over||R.draw)return;
  const c=R.turn,e=other(c),r=applyMove(R.G,m,c),n=clone(R);
  const nm=p=>p?(p.pr?PROM[p.t]:KANJI[p.t]):'';
  const P0=m.d?null:R.G.b[m.f],Q0=R.G.b[m.t],after=r.G.b[m.t];
  n.G=r.G;n.ply++;n.turn=e;n.to[c]=auto?(n.to[c]||0)+1:0;
  n.hist.push({k:posKey(r.G,e),by:c,chk:inCheck(r.G,e)});
  n.last={f:m.f==null?null:m.f,t:m.t,d:m.d||null,auto:!!auto,ev:r.ev,by:c,fx:r.fx||[],s:m.s||null,
    pn:m.d?KANJI[m.d]:nm(P0),qn:r.ev==='summon'?nm(after):nm(Q0),cnt:Math.max(0,(r.fx||[]).length-1),pr:!!m.pr,sh:after&&after.sh||0};
  n.ends=Date.now()+moveMs(n,e);sel=null;promo=null;
  let end=null;
  if(!hasKing(r.G,e))end=[c,'王を取った'];
  else if(auto&&n.to[c]>=2)end=[e,'時間切れが2回続いた'];
  else if(legalMoves(r.G,e).length===0)end=[c,'詰み'];
  else if(!n.practice){const k=n.hist[n.hist.length-1].k,idx=n.hist.map((h,i)=>h.k===k?i:-1).filter(i=>i>=0);
    if(idx.length>=4){const seg=n.hist.slice(idx[0]+1);
      const perp=['a','b'].find(x=>{const mv=seg.filter(h=>h.by===x);return mv.length&&mv.every(h=>h.chk);});
      end=perp?[other(perp),'連続王手の千日手']:[null,'千日手'];}}
  if(end&&n.practice){n.over={w:end[0],reason:end[1]};return saveRoom(n);}
  if(end)return finishMatch(n,end[0],end[1]);
  if(!n.practice&&n.settings.mid&&n.ply%n.settings.mid===0){n.draw={at:n.ply};n.lastDraw=null;}
  saveRoom(n);
}
async function finishMatch(n,w,reason){
  n.result={w,reason,match:n.match};
  if(w)n.score[w]++;
  if(w&&n.score[w]>=n.settings.wins){n.phase='over';return saveRoom(n);}
  n.phase='picking';
  const picks=w?{[w]:2,[other(w)]:3}:{a:2,b:2};
  n.sente=w?other(w):other(n.sente);
  await Promise.all(['a','b'].map(s=>{const sd=clone(SEATS[s]||blankSeat());sd.pick={left:picks[s],offer:null,m:n.match};return saveSeat(s,sd);}));
  await saveRoom(n);
}
function resign(){const R=ROOM;const s=online?mySeat:cpuSeat()?other(cpuSeat()):R.turn;confirmResign=false;finishMatch(clone(R),other(s),'投了');}
function roll(s){const n=clone(SEATS[s]||blankSeat());n.dice={r:1+Math.floor(Math.random()*6),n:Math.random().toString(36).slice(2,6)};saveSeat(s,n);}
async function resolveDice(){
  const ra=SEATS.a.dice.r,rb=SEATS.b.dice.r;
  if(ra===rb){const n=clone(ROOM);n.msg=`どちらも${ra}でした。振り直してください。`;
    await Promise.all(['a','b'].map(s=>{const sd=clone(SEATS[s]);sd.dice=null;return saveSeat(s,sd);}));return saveRoom(n);}
  const w=ra>rb?'a':'b';
  await Promise.all(['a','b'].map(s=>{const sd=clone(SEATS[s]);sd.pick={left:s===w?3:2,offer:null,m:0};return saveSeat(s,sd);}));
  const n=clone(ROOM);n.phase='picking';n.sente=other(w);n.msg='';n.result={w,reason:`サイコロ（${ra} 対 ${rb}）`,match:0};saveRoom(n);
}
function eligible(sd,cid){const c=CARDS[cid];return setupFor(sd).filter(z=>c.types.includes(z.t)&&!((sd.enh||{})[z.id]||[]).some(e=>e.c===cid));}
function drawOffer(s,sd){
  const lost=ROOM.result&&ROOM.result.w&&ROOM.result.w!==s;
  let pool=CARD_IDS.filter(id=>CARDS[id].player?(((sd.pl||{})[id]||0)<2):eligible(sd,id).length>0)
    .map(id=>({id,w:TIER_W[CARDS[id].tier]+(lost&&CARDS[id].tier==='強'?1:0)}));
  const out=[];
  while(out.length<3&&pool.length){const tot=pool.reduce((a,b)=>a+b.w,0);let r=Math.random()*tot,k=0;
    for(;k<pool.length;k++){r-=pool[k].w;if(r<=0)break;}k=Math.min(k,pool.length-1);out.push(pool[k].id);pool.splice(k,1);}
  return out;
}
function takePlayerCard(s,cid){const n=clone(SEATS[s]);n.pl=n.pl||{};n.pl[cid]=(n.pl[cid]||0)+1;n.pick.left--;n.pick.offer=null;pickUI=null;saveSeat(s,n);}
function takePieceCard(s,cid,ids){const n=clone(SEATS[s]);n.enh=n.enh||{};const f=ids.length===1;
  ids.forEach(id=>{n.enh[id]=(n.enh[id]||[]).concat({c:cid,f});});n.pick.left--;n.pick.offer=null;pickUI=null;saveSeat(s,n);}
async function rematch(){
  const n=clone(ROOM);n.score={a:0,b:0};n.match=0;n.result=null;n.msg='';
  await Promise.all(['a','b'].map(s=>saveSeat(s,blankSeat())));
  if(n.settings.first==='dice'){n.phase='dice';n.G=null;saveRoom(n);}else saveRoom(startMatch(n,Math.random()<.5?'a':'b'));
}
function drive(){
  if(!ROOM)return;const mine=mySeats();if(!mine.length)return;
  if(ROOM.phase==='picking'){
    for(const s of mine){const sd=SEATS[s];if(sd&&sd.pick&&sd.pick.m===ROOM.match&&sd.pick.left>0&&!sd.pick.offer)
      once(`of-${s}-${ROOM.match}-${sd.pick.left}`,()=>{const n=clone(sd);n.pick.offer=drawOffer(s,n);saveSeat(s,n);});}
    const done=['a','b'].every(s=>SEATS[s]&&SEATS[s].pick&&SEATS[s].pick.m===ROOM.match&&SEATS[s].pick.left===0);
    if(done)once('st-'+ROOM.match,()=>saveRoom(startMatch(ROOM)));
  }
  if(ROOM.phase==='dice'){const a=SEATS.a&&SEATS.a.dice,b=SEATS.b&&SEATS.b.dice;
    if(a&&b)once(`dc-${a.n}-${b.n}`,()=>resolveDice());}
  driveMid();
  const cs=cpuSeat();
  if(cs){
    if(ROOM.phase==='playing'&&ROOM.turn===cs&&!ROOM.over&&!ROOM.draw)once(`cpu-${ROOM.match}-${ROOM.ply}-${ROOM.rev||0}`,()=>setTimeout(()=>{
      const R=ROOM;if(!R||R.phase!=='playing'||R.turn!==cs||R.over||R.draw)return;const m=cpuMove(R.G,cs,R.cpu.lv);if(m)doMove(m);},500));
    if(ROOM.phase==='picking'){const sd=SEATS[cs];if(sd&&sd.pick&&sd.pick.m===ROOM.match&&sd.pick.left>0&&sd.pick.offer)
      once(`cpk-${ROOM.match}-${sd.pick.left}`,()=>setTimeout(()=>cpuPick(cs),300));}
    if(ROOM.phase==='dice'){const hd=SEATS[other(cs)]&&SEATS[other(cs)].dice;
      if(hd&&!(SEATS[cs]&&SEATS[cs].dice))once('cdi-'+hd.n,()=>setTimeout(()=>roll(cs),400));}
  }
}
function rerender(){render();drive();}

async function joinRoom(c,id){

    const s=await db.doc('rooms/'+c).get();
    if(!s.exists){errMsg='部屋が見つかりません。コードを確認してください。';return render();}

  for(const x of['a','b'])unsubs.push(db.doc(`rooms/${code}/seats/${x}`).onSnapshot(s=>{if(s.exists){SEATS[x]=clone(s.data());rerender();}},handleErr));
}

let legalCache={k:'',ms:[]};
function myLegal(){const R=ROOM;if(!R||R.phase!=='playing'||R.over||R.draw||!canAct(R.turn))return[];
  if(R.practice&&PR.tool!=='move')return[];
  const k=R.match+'-'+R.ply+'-'+R.turn+'-'+(R.rev||0)+'-'+(R.settings.loose?1:0);
  if(legalCache.k!==k){let ms;
    if(R.settings.loose){ms=looseMoves(R.G,R.turn).map(m=>{const r=applyMove(R.G,m,R.turn);return inCheck(r.G,R.turn)?{...m,bad:1}:m;});}
    else ms=legalMoves(R.G,R.turn);
    legalCache={k,ms};}
  return legalCache.ms;}
const kanjiOf=p=>p.pr?PROM[p.t]:(p.t==='K'&&p.o==='a'?'王':KANJI[p.t]);

function practiceEdit(fn){const n=clone(ROOM);n.rev=(n.rev||0)+1;if(fn(n)===false)return;n.over=null;sel=null;promo=null;saveRoom(n);}
function attachCard(n,i){

function applyCardToPiece(p,cid,f){
  p.e=(p.e||[]).filter(e=>e.c!==cid).concat({c:cid,f});
  switch(cid){
    case 'c13':p.rv=f?2:1;break;
    case 'c14':p.sh=(p.sh||0)+(f?2:1);break;
    case 'c45':p.sh=(p.sh||0)+1;break;
    case 'c21':p.cv=f?2:1;break;

let midUI=null;

function midTargets(R,s,cid){const c=CARDS[cid],out=[];if(c.player)return out;
  R.G.b.forEach((p,i)=>{if(p&&p.o===s&&c.types.includes(p.t)&&!(p.e||[]).some(e=>e.c===cid))out.push(i);});return out;}
function midOffer(s){
  const R=ROOM;let pool=CARD_IDS.filter(id=>!MID_SKIP.has(id)&&(CARDS[id].player?((((R.G.pl||{})[s]||{})[id]||0)<2):midTargets(R,s,id).length>0))
    .map(id=>({id,w:TIER_W[CARDS[id].tier]}));
  const out=[];
  while(out.length<3&&pool.length){const tot=pool.reduce((a,b)=>a+b.w,0);let r=Math.random()*tot,k=0;
    for(;k<pool.length;k++){r-=pool[k].w;if(r<=0)break;}k=Math.min(k,pool.length-1);out.push(pool[k].id);pool.splice(k,1);}
  return out;
}
function chooseMid(s,choice){const n=clone(SEATS[s]);n.mid.choice=choice;if(midUI&&midUI.s===s)midUI=null;saveSeat(s,n);}
function cpuMidPick(s){const md=SEATS[s]&&SEATS[s].mid;if(!md||!md.offer||!md.offer.length||md.choice)return;
  const w={'強':3,'中':2,'弱':1};const c=md.offer.map(id=>({id,v:w[CARDS[id].tier]+Math.random()*1.5})).sort((a,b)=>b.v-a.v)[0].id;
  if(CARDS[c].player)return chooseMid(s,{c,i:-1});
  const t=midTargets(ROOM,s,c).map(i=>({i,v:VAL[ROOM.G.b[i].t]+Math.random()*3})).sort((a,b)=>b.v-a.v)[0];
  if(t)chooseMid(s,{c,i:t.i});}
function applyMid(){
  const R=ROOM;if(!R||!R.draw)return;const n=clone(R);n.G.mid=n.G.mid||{a:[],b:[]};const list=[];
  for(const s of['a','b']){const md=SEATS[s]&&SEATS[s].mid;if(!md||!md.choice)continue;const {c,i}=md.choice;
    if(CARDS[c].player){n.G.pl=n.G.pl||{a:{},b:{}};n.G.pl[s]=n.G.pl[s]||{};n.G.pl[s][c]=(n.G.pl[s][c]||0)+1;list.push({s,c,t:null});n.G.mid[s].push({c,t:null});}
    else{const p=n.G.b[i];if(!p||p.o!==s)continue;applyCardToPiece(p,c,true);list.push({s,c,t:p.t});n.G.mid[s].push({c,t:p.t});}}
  n.lastDraw={at:n.draw.at,list};n.draw=null;n.rev=(n.rev||0)+1;n.ends=Date.now()+moveMs(n,n.turn);midUI=null;saveRoom(n);
}
function driveMid(){
  const R=ROOM;if(!R||R.phase!=='playing'||!R.draw)return;const D=R.draw,mine=mySeats();
  const cur=s=>{const md=SEATS[s]&&SEATS[s].mid;return md&&md.at===D.at&&md.m===R.match?md:null;};

  const cs=cpuSeat();if(cs&&cur(cs)&&!cur(cs).choice)once(`mc-${R.match}-${D.at}`,()=>setTimeout(()=>cpuMidPick(cs),500));

function onCell(i){
  const R=ROOM;if(!R||R.phase!=='playing'||promo)return;
  const p=R.G.b[i];
  if(R.draw){if(midUI&&midTargets(R,midUI.s,midUI.c).includes(i))chooseMid(midUI.s,{c:midUI.c,i});else{info=p?i:null;render();}return;}
  if(R.practice&&PR.tool==='card'){if(p)practiceEdit(n=>attachCard(n,i));return;}
  if(R.practice&&PR.tool==='erase'){if(p&&p.t!=='K'){info=null;practiceEdit(n=>{n.G.b[i]=null;});}return;}
  if(sel){const ms=selMoves().filter(m=>m.t===i);
    if(ms.length){if(ms.length===2&&!(p&&p.t==='K')){promo={f:sel.f,t:i};return render();}return doMove(ms[0]);}}
  info=p?i:null;
  const can=p&&p.o===R.turn&&canAct(R.turn)&&myLegal().some(m=>m.f===i);
  sel=can?{f:i}:null;
  render();
}

function tick(){
  const R=ROOM;if(!R||R.phase!=='playing'||R.practice||R.over||R.draw)return;
  const left=R.ends-Date.now(),tot=moveMs(R,R.turn);
  const t=document.getElementById('timer'),tl=document.getElementById('tleft');
  if(t){t.firstElementChild.style.width=Math.max(0,Math.min(100,left/tot*100))+'%';t.classList.toggle('low',left<5000);}
  if(tl)tl.textContent='残り '+Math.max(0,Math.ceil(left/1000))+' 秒';
  if(left<=0){const mine=canAct(R.turn);
    if(mine||(left<=-4000&&mySeats().length))once(`to-${R.match}-${R.ply}`,()=>{const m=autoMove(R.G,R.turn);if(m)doMove(m,true);});}
}

      canWrite=true;
    }
  }catch(e){console.error(e);db=null;}
  dbReady=true;render();
})();
</script>
